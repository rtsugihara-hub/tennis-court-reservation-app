spring.application.name=tennis-reservation-backend
spring.sql.init.mode=always

# Dockerコンテナ名「db」を指定
spring.datasource.url=jdbc:mysql://db:3306/tennis_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectTimeout=10000&socketTimeout=10000
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate 設定
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Swagger UI で static/openapi.yaml を読み込む設定
springdoc.swagger-ui.url=/openapi.yaml