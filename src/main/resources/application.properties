# \u30b5\u30fc\u30d0\u30fc\u30dd\u30fc\u30c8\uff08WebSquare Tomcat\u3068\u306e\u91cd\u8907\u56de\u907f\u306e\u305f\u3081 8081\uff09
server.port=8081

# \u30c7\u30fc\u30bf\u30d9\u30fc\u30b9\u63a5\u7d9a\u8a2d\u5b9a (\u30ed\u30fc\u30ab\u30eb\u306eDocker\u30b3\u30f3\u30c6\u30ca\u3078\u63a5\u7d9a)
spring.datasource.url=jdbc:mysql://localhost:3306/tennis_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate \u8a2d\u5b9a
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Swagger UI \u3067 static/openapi.yaml \u3092\u8aad\u307f\u8fbc\u3080\u8a2d\u5b9a
springdoc.swagger-ui.url=/openapi.yaml