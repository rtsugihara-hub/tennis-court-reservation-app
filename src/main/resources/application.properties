# サーバーポートを 8081 に変更（8080のWebSquare Tomcatとの重複回避）
server.port=8081

# データベース接続設定 (Docker)
spring.datasource.url=jdbc:mysql://localhost:3306/tennis_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate 設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true