version: '3.8'

services:
  # 1. データベースコンテナ (MySQL)
  db:
    image: mysql:8.0
    container_name: tennis-db
    environment:
      MYSQL_DATABASE: tennis_db
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # パス指定を ./backend/sql から ./sql に調整（SQLファイルの配置場所に合わせて変更）
      - ./sql/create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql
      - ./sql/insert_data.sql:/docker-entrypoint-initdb.d/02_insert_data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "user", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. WebSquare画面エンジン専用コンテナ(素のTomcat、Spring Boot APIとはポート/プロセスを分離)
  websquare:
    build:
      context: .
      dockerfile: Dockerfile.websquare
    container_name: tennis-websquare
    ports:
      - "8080:8080"

  # 3. Spring Boot REST API(各画面がブラウザから直接 http://localhost:8081 を叩く構成のため、
  # Tomcat側からのプロキシ設定は不要 — ポートを公開するだけでよい)
  backend:
    image: tennis-court-reservation-app-backend:latest
    container_name: tennis-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/tennis_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      # このイメージは8週間前のビルド(server.port=8081への変更より前)のため、
      # アプリ内部では8080のまま起動する — 環境変数で8081へ強制上書きする。
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: