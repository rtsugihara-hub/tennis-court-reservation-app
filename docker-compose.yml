version: '3.8'

services:
  # 1. データベースコンテナ (MySQL)
  db:
    image: mysql:8.0
    container_name: tennis-db
    environment:
      MYSQL_DATABASE: tennis_db
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # backend/sql/create_table.sql を自動実行するように設定
      - ./backend/sql/create_table.sql:/docker-entrypoint-initdb.d/create_table.sql

  # 2. バックエンドコンテナ (Java / Spring Boot)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tennis-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/tennis_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db

# 3. フロントエンドコンテナ (React / Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tennis-frontend
    ports:
      - "5173:5173"
    volumes:
      # フロントエンド直下の全ファイルを同期
      - ./frontend:/app
      # コンテナ内の node_modules がローカルで上書きされないよう保護
      - /app/node_modules
    environment:
      # Windows環境等でホットリロードを確実に効かせる設定
      - WATCHPACK_POLLING=true
    depends_on:
      - backend

# データ永続化用のボリューム定義
volumes:
  mysql_data: