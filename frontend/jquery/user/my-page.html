<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイページ - テニスコート予約システム</title>
  <!-- jQuery (CDN) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body style="font-family: sans-serif; margin: 0; background-color: #f8f9fa;">

  <!-- 共通ヘッダー読み込みエリア -->
  <div id="headerContainer"></div>

  <div style="display: flex;">
    <!-- 共通サイドバー読み込みエリア -->
    <div id="sidebarContainer"></div>

    <!-- メインコンテンツ -->
    <main style="padding: 20px; flex: 1;">
      <h2 style="margin-top: 0; margin-bottom: 20px; color: #333;">マイページ</h2>

      <!-- ■ 会員情報エリア -->
      <div style="margin-bottom: 30px;">
        <h3 style="margin: 0 0 15px 0; border-bottom: 1px solid #eee; padding-bottom: 8px;">
          会員情報
        </h3>
        <div style="display: flex; flex-direction: column; gap: 12px; font-size: 18px; color: #333;">
          <div style="display: flex; align-items: center;">
            <span style="font-weight: bold; width: 80px;">氏名：</span>
            <span id="userNameText">- 様</span>
          </div>
          <div style="display: flex; align-items: center;">
            <span style="font-weight: bold; width: 80px;">メール：</span>
            <span id="userEmailText">-</span>
          </div>
        </div>
      </div>

      <!-- ■ 予約履歴一覧エリア -->
      <div style="border-radius: 8px; padding: 10px 0; background-color: #fff;">
        <h3 style="margin: 0 0 15px 0;">■ 予約履歴一覧</h3>
        <p id="loadingText" style="text-align: center; color: #666;">データを読み込み中...</p>

        <table
          id="reservationTable"
          style="
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #333;
            text-align: center;
            display: none;
          "
        >
          <thead>
            <tr style="background-color: #d4edda; border-bottom: 1px solid #333;">
              <th style="border: 1px solid #333; padding: 12px; font-size: 16px;">予約ID</th>
              <th style="border: 1px solid #333; padding: 12px; font-size: 16px;">コート名</th>
              <th style="border: 1px solid #333; padding: 12px; font-size: 16px;">利用日時</th>
              <th style="border: 1px solid #333; padding: 12px; font-size: 16px;">合計料金</th>
              <th style="border: 1px solid #333; padding: 12px; font-size: 16px;">ステータス</th>
              <th style="border: 1px solid #333; padding: 12px; font-size: 16px;">操作</th>
            </tr>
          </thead>
          <tbody id="reservationTableBody">
            <!-- JavaScriptで動的描画 -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- JavaScript ロジック -->
  <script>
    $(document).ready(function () {
      const API_BASE_URL = 'http://localhost:8080/api';

      // 共通コンポーネント読み込み
      $('#headerContainer').load('../components/header.html');
      $('#sidebarContainer').load('../components/sidebar.html');

      // 1. ログインチェックおよびユーザー情報の表示
      const userStr = localStorage.getItem('currentUser');
      if (!userStr) {
        alert('ログインが必要です。');
        window.location.href = '../login.html';
        return;
      }

      const currentUser = JSON.parse(userStr);
      $('#userNameText').text(`${currentUser.name} 様`);
      $('#userEmailText').text(currentUser.email);

      // 初期予約一覧ロード
      fetchUserReservations();

      // 2. ログインユーザーの予約履歴一覧取得 API 実行
      function fetchUserReservations() {
        $('#loadingText').show();
        $('#reservationTable').hide();

        $.ajax({
          url: `${API_BASE_URL}/reservations/user/${currentUser.id}`,
          type: 'GET',
          dataType: 'json',
          success: function (reservations) {
            renderTable(reservations || []);
          },
          error: function (xhr, status, error) {
            console.error(error);
            alert('予約履歴の取得に失敗しました。');
          },
          complete: function () {
            $('#loadingText').hide();
            $('#reservationTable').show();
          }
        });
      }

      // 3. ステータス表示テキストの変換関数
      function getStatusText(status) {
        if (status === 'completed' || status === '利用済' || status === '来店済') return '利用済';
        if (status === 'cancelled' || status === 'キャンセル') return 'キャンセル';
        return '予約確定';
      }

      // 4. ステータスに応じたバッジスタイルの判定関数
      function getStatusBadgeStyle(status) {
        if (status === 'completed' || status === '利用済' || status === '来店済') {
          return { backgroundColor: '#e2e3e5', color: '#41464b', borderColor: '#d3d6d8' };
        }
        if (status === 'cancelled' || status === 'キャンセル') {
          return { backgroundColor: '#f8d7da', color: '#842029', borderColor: '#f5c2c7' };
        }
        return { backgroundColor: '#d4edda', color: '#0f5132', borderColor: '#badbcc' };
      }

      // 5. テーブル描画処理
      function renderTable(reservations) {
        const $tbody = $('#reservationTableBody');
        $tbody.empty();

        if (reservations.length === 0) {
          $tbody.append(`
            <tr>
              <td colspan="6" style="padding: 20px; color: #666; font-size: 16px;">
                予約履歴がありません。
              </td>
            </tr>
          `);
          return;
        }

        reservations.forEach(function (res) {
          const badgeStyle = getStatusBadgeStyle(res.status);
          const statusText = getStatusText(res.status);
          const priceText = res.totalPrice ? `¥${res.totalPrice.toLocaleString()}` : '¥0';

          const $tr = $(`
            <tr style="border-bottom: 1px solid #333;">
              <td style="border: 1px solid #333; padding: 14px; font-size: 16px;">${res.id}</td>
              <td style="border: 1px solid #333; padding: 14px; font-size: 16px;">${escapeHtml(res.courtName || '')}</td>
              <td style="border: 1px solid #333; padding: 14px; font-size: 16px;">
                ${res.date || ''} ${res.timeSlot || ''}
              </td>
              <td style="border: 1px solid #333; padding: 14px; font-size: 16px;">${priceText}</td>
              <td style="border: 1px solid #333; padding: 14px;">
                <span
                  style="
                    display: inline-block;
                    padding: 6px 16px;
                    font-size: 14px;
                    font-weight: bold;
                    border-radius: 6px;
                    background-color: ${badgeStyle.backgroundColor};
                    color: ${badgeStyle.color};
                    border: 1px solid ${badgeStyle.borderColor};
                  "
                >
                  ${statusText}
                </span>
              </td>
              <td style="border: 1px solid #333; padding: 14px;">
                <button
                  class="btn-detail"
                  style="
                    background-color: #00a0e9;
                    color: #fff;
                    border: none;
                    border-radius: 6px;
                    padding: 8px 20px;
                    font-size: 14px;
                    font-weight: bold;
                    cursor: pointer;
                  "
                >
                  詳細・変更
                </button>
              </td>
            </tr>
          `);

          // 「詳細・変更」ボタン押下時ハンドラ
          $tr.find('.btn-detail').on('click', function () {
            // 選択された予約情報を sessionStorage にセットして詳細画面へ遷移
            sessionStorage.setItem('selectedReservation', JSON.stringify(res));
            window.location.href = './reservation-detail.html';
          });

          $tbody.append($tr);
        });
      }

      // XSS対策用エスケープ関数
      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }
    });
  </script>
</body>
</html>
