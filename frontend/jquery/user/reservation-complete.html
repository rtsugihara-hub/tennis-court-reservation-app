<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約完了 - テニスコート予約システム</title>
  <!-- jQuery (CDN) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body style="font-family: sans-serif; margin: 0; background-color: #f8f9fa;">

  <!-- 共通ヘッダー読み込みエリア -->
  <div id="headerContainer"></div>

  <div style="display: flex;">
    <!-- 共通サイドバー読み込みエリア -->
    <div id="sidebarContainer"></div>

    <!-- メインコンテンツ -->
    <main
      style="
        padding: 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
      "
    >
      <div style="width: 100%; max-width: 600px;">
        <!-- 画面タイトル -->
        <h2 style="margin-top: 0; margin-bottom: 20px; color: #333;">予約完了</h2>

        <div
          style="
            background-color: #fff;
            padding: 40px 24px;
            border-radius: 8px;
            border: 1px solid #ddd;
            text-align: center;
          "
        >
          <h3 style="margin-top: 0; color: #28a745; font-size: 22px; margin-bottom: 16px;">
            予約が完了いたしました！
          </h3>
          <p style="font-size: 15px; color: #555; margin-bottom: 32px;">
            ご予約ありがとうございました。マイページより予約の確認が行えます。
          </p>

          <!-- 遷移ボタンエリア -->
          <div style="display: flex; gap: 16px; justify-content: center;">
            <button
              type="button"
              id="btnGoToDashboard"
              style="
                padding: 10px 24px;
                background-color: #6c757d;
                color: #fff;
                font-size: 15px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
              "
            >
              ダッシュボードへ
            </button>
            <button
              type="button"
              id="btnGoToMyPage"
              style="
                padding: 10px 24px;
                background-color: #007bff;
                color: #fff;
                font-size: 15px;
                font-weight: bold;
                border: none;
                border-radius: 4px;
                cursor: pointer;
              "
            >
              予約履歴を確認する
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- JavaScript ロジック -->
  <script>
    $(document).ready(function () {
      // 共通コンポーネント読み込み
      $('#headerContainer').load('../components/header.html');
      $('#sidebarContainer').load('../components/sidebar.html');

      // ログインチェック
      const userStr = localStorage.getItem('currentUser');
      if (!userStr) {
        alert('ログインが必要です。');
        window.location.href = '../login.html';
        return;
      }

      // ボタン遷移イベントハンドラ
      $('#btnGoToDashboard').on('click', function () {
        window.location.href = './dashboard.html';
      });

      $('#btnGoToMyPage').on('click', function () {
        window.location.href = './my-page.html';
      });
    });
  </script>
</body>
</html>
