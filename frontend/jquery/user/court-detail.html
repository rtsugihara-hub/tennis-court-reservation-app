<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>コート詳細 - テニスコート予約システム</title>
  <!-- jQuery (CDN) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body style="font-family: sans-serif; margin: 0; background-color: #f8f9fa;">

  <!-- 共通ヘッダー読み込みエリア -->
  <div id="headerContainer"></div>

  <div style="display: flex;">
    <!-- 共通サイドバー読み込みエリア -->
    <div id="sidebarContainer"></div>

    <!-- メインコンテンツ -->
    <main
      style="
        padding: 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
      "
    >
      <div style="width: 100%; max-width: 600px;">
        <!-- 画面タイトル -->
        <h2 style="margin-top: 0; margin-bottom: 20px; color: #333;">コート詳細</h2>

        <div
          style="
            background-color: #fff;
            padding: 24px;
            border-radius: 8px;
            border: 1px solid #ddd;
          "
        >
          <h3 style="margin-top: 0; border-bottom: 2px solid #333; padding-bottom: 10px; color: #333;">
            コート詳細情報
          </h3>

          <div style="display: grid; grid-template-columns: 120px 1fr; gap: 12px; margin: 24px 0; font-size: 15px;">
            <strong>コート名:</strong> <div id="courtNameText">-</div>
            <strong>コート種別:</strong> <div id="courtTypeText">-</div>
            <strong>屋内外:</strong> <div id="indoorText">-</div>
            <strong>利用日時:</strong> <div id="dateTimeText">-</div>
            <strong>利用料金:</strong> <div id="priceText">¥0</div>
            <strong>概要・説明:</strong> <div id="descriptionText">-</div>
          </div>

          <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px;">
            <button
              type="button"
              id="btnBack"
              style="padding: 8px 20px; background-color: #6c757d; color: #fff; border: none; border-radius: 4px; cursor: pointer;"
            >
              一覧へ戻る
            </button>
            <button
              type="button"
              id="btnGoToConfirm"
              style="padding: 8px 20px; color: #fff; border: none; border-radius: 4px;"
            >
              予約手続きへ
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- JavaScript ロジック -->
  <script>
    $(document).ready(function () {
      // 共通コンポーネント読み込み
      $('#headerContainer').load('../components/header.html');
      $('#sidebarContainer').load('../components/sidebar.html');

      // 1. ログインチェック
      const userStr = localStorage.getItem('currentUser');
      if (!userStr) {
        alert('ログインが必要です。');
        window.location.href = '../login.html';
        return;
      }

      // 2. 選択されたコート情報の復元 (sessionStorage)
      const selectedCourtStr = sessionStorage.getItem('selectedCourt');
      if (!selectedCourtStr) {
        alert('コート情報が見つかりません。一覧画面から選択し直してください。');
        window.location.href = './court-list.html';
        return;
      }

      const court = JSON.parse(selectedCourtStr);

      // 画面要素へのデータセット
      $('#courtNameText').text(court.name || '-');
      $('#courtTypeText').text(court.type || '-');
      $('#indoorText').text(court.isIndoor ? '屋内' : '屋外');
      $('#dateTimeText').text(`${court.date || ''} ${court.timeSlot || ''}`);
      $('#priceText').text(`¥${court.pricePerHour ? court.pricePerHour.toLocaleString() : '0'}`);
      $('#descriptionText').text(court.description || '');

      // ボタンの状態判定 (status === 'available')
      const isAvailable = court.status === 'available';
      const $btnConfirm = $('#btnGoToConfirm');

      if (isAvailable) {
        $btnConfirm
          .text('予約手続きへ')
          .css({ 'background-color': '#28a745', 'cursor': 'pointer' })
          .prop('disabled', false);
      } else {
        $btnConfirm
          .text('予約不可')
          .css({ 'background-color': '#6c757d', 'cursor': 'not-allowed' })
          .prop('disabled', true);
      }

      // イベントハンドラ
      $('#btnBack').on('click', function () {
        window.location.href = './court-list.html';
      });

      $btnConfirm.on('click', function () {
        if (isAvailable) {
          window.location.href = './reservation-confirm.html';
        }
      });
    });
  </script>
</body>
</html>
