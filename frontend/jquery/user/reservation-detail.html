<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約詳細 - テニスコート予約システム</title>
  <!-- jQuery (CDN) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body style="font-family: sans-serif; margin: 0; background-color: #f8f9fa;">

  <!-- 共通ヘッダー読み込みエリア -->
  <div id="headerContainer"></div>

  <div style="display: flex;">
    <!-- 共通サイドバー読み込みエリア -->
    <div id="sidebarContainer"></div>

    <!-- メインコンテンツ -->
    <main
      style="
        padding: 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
      "
    >
      <div style="width: 100%; max-width: 600px;">
        <!-- 画面タイトル -->
        <h2 style="margin-top: 0; margin-bottom: 20px; color: #333;">予約詳細</h2>

        <!-- カードコンテナ -->
        <div
          style="
            background-color: #fff;
            padding: 24px;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
          "
        >
          <h3 style="margin-top: 0; border-bottom: 2px solid #333; padding-bottom: 10px; color: #333;">
            予約詳細情報
          </h3>

          <div style="display: grid; grid-template-columns: 130px 1fr; gap: 14px; margin: 24px 0; font-size: 15px;">
            <strong>予約ID:</strong> <div id="resIdText">-</div>
            <strong>予約者名:</strong> <div id="userNameText">-</div>
            <strong>コート名:</strong> <div id="courtNameText">-</div>
            <strong>利用日時:</strong> <div id="dateTimeText">-</div>
            <strong>お支払金額:</strong> <div id="priceText">¥0</div>
            <strong>予約ステータス:</strong> 
            <div id="statusText" style="font-weight: bold;">-</div>
            <strong>予約申込日時:</strong> <div id="createdAtText">-</div>
          </div>

          <!-- ボタンエリア -->
          <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px;">
            <button
              type="button"
              id="btnBackToMyPage"
              style="
                padding: 8px 20px;
                background-color: #6c757d;
                color: #fff;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
              "
            >
              マイページへ戻る
            </button>

            <button
              type="button"
              id="btnCancelReservation"
              style="
                padding: 8px 20px;
                background-color: #dc3545;
                color: #fff;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
                font-weight: bold;
                display: none;
              "
            >
              予約キャンセル
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- JavaScript ロジック -->
  <script>
    $(document).ready(function () {
      const API_BASE_URL = 'http://localhost:8080/api';
      let isLoading = false;
      let currentReservation = null;

      // 共通コンポーネント読み込み
      $('#headerContainer').load('../components/header.html');
      $('#sidebarContainer').load('../components/sidebar.html');

      // 1. ログインチェック
      const userStr = localStorage.getItem('currentUser');
      if (!userStr) {
        alert('ログインが必要です。');
        window.location.href = '../login.html';
        return;
      }
      const currentUser = JSON.parse(userStr);

      // 2. 選択された予約情報の復元 (sessionStorage)
      const selectedResStr = sessionStorage.getItem('selectedReservation');
      if (!selectedResStr) {
        alert('予約情報が見つかりません。マイページより選択し直してください。');
        window.location.href = './my-page.html';
        return;
      }

      currentReservation = JSON.parse(selectedResStr);

      // 初期画面描画
      renderReservationDetails();

      // 3. イベントバインド
      $('#btnBackToMyPage').on('click', function () {
        if (!isLoading) {
          window.location.href = './my-page.html';
        }
      });

      $('#btnCancelReservation').on('click', handleCancelReservation);

      // 4. 画面描画処理
      function renderReservationDetails() {
        const isCanceled = currentReservation.status === 'cancelled';

        $('#resIdText').text(currentReservation.id);
        $('#userNameText').text(currentUser.name || '-');
        $('#courtNameText').text(currentReservation.courtName || '-');
        $('#dateTimeText').text(`${currentReservation.date || ''} ${currentReservation.timeSlot || ''}`);
        $('#priceText').text(`¥${currentReservation.totalPrice ? currentReservation.totalPrice.toLocaleString() : '0'}`);
        $('#createdAtText').text(currentReservation.createdAt || '2026-08-24 17:00');

        // ステータステキストおよび色の制御
        const $statusText = $('#statusText');
        if (isCanceled) {
          $statusText.text('キャンセル済').css('color', '#dc3545');
        } else if (currentReservation.status === 'completed') {
          $statusText.text('利用済').css('color', '#6c757d');
        } else {
          $statusText.text('予約済').css('color', '#28a745');
        }

        // キャンセルボタンの表示制御（「予約済」の場合のみ表示）
        if (!isCanceled && currentReservation.status === 'confirmed') {
          $('#btnCancelReservation').show();
        } else {
          $('#btnCancelReservation').hide();
        }
      }

      // 5. 予約キャンセル処理 (API通信)
      function handleCancelReservation() {
        if (isLoading) return;

        if (!confirm('この予約をキャンセルしますか？')) return;

        setLoadingState(true);

        $.ajax({
          url: `${API_BASE_URL}/reservations/${currentReservation.id}/cancel`,
          type: 'PUT',
          contentType: 'application/json',
          success: function () {
            alert('予約をキャンセルいたしました。');
            currentReservation.status = 'cancelled';
            
            // sessionStorage 側も更新
            sessionStorage.setItem('selectedReservation', JSON.stringify(currentReservation));
            
            renderReservationDetails();
          },
          error: function (xhr, status, error) {
            console.error('キャンセルエラー:', error);
            alert('予約のキャンセル処理に失敗しました。');
          },
          complete: function () {
            setLoadingState(false);
          }
        });
      }

      // ローディング状態制御関数
      function setLoadingState(loading) {
        isLoading = loading;
        const $btnCancel = $('#btnCancelReservation');
        const $btnBack = $('#btnBackToMyPage');

        if (loading) {
          $btnCancel
            .prop('disabled', true)
            .css({ 'background-color': '#6c757d', 'cursor': 'not-allowed' })
            .text('処理中...');
          $btnBack.prop('disabled', true).css('cursor', 'not-allowed');
        } else {
          $btnCancel
            .prop('disabled', false)
            .css({ 'background-color': '#dc3545', 'cursor': 'pointer' })
            .text('予約キャンセル');
          $btnBack.prop('disabled', false).css('cursor', 'pointer');
        }
      }
    });
  </script>
</body>
</html>
